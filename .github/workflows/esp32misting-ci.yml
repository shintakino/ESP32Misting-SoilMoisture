name: ESP32Misting-SoilMoisture CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build and run unit tests
        run: |
          set -e
          cd ESP32Misting-SoilMoisture
          make
          ./tests/test_moisture
